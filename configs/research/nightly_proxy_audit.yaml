    source_run: runs/showcase/pretrained_pbt_4gpu_night_controller_active_20260805_015318
    provenance: {type: global_best_metadata, path: runs/showcase/pretrained_pbt_4gpu_night_controller_active_20260805_015318/checkpoints/global_best_metadata.json}

  - id: exploit_mutate_tiered_pilot_bnfreeze_global_best
    path: runs/pbt/pretrained_exploit_mutate_8gpu_10m_tiered_pilot_bnfreeze_20260804_034612/checkpoints/global_best_state.pt
    source_run: runs/pbt/pretrained_exploit_mutate_8gpu_10m_tiered_pilot_bnfreeze_20260804_034612
    provenance: {type: global_best_metadata, path: runs/pbt/pretrained_exploit_mutate_8gpu_10m_tiered_pilot_bnfreeze_20260804_034612/checkpoints/global_best_metadata.json}

  - id: legacy_guarded_resume_global_best
