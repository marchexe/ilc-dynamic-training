# Stage 3 arm A (frozen protocol configs/prepared/stage3_train8m_v1): fixed-LR
# population on train8m. Inherits the frozen fixed-LR contract unchanged; only
# the training input differs. Launch only via scripts/experiments/run_stage3_train8m.sh.
presets:
  - configs/experiments/foundation_fixed_lr_50epochs.yaml
experiment:
  name: stage3_train8m_fixed_lr_v1
  output_root: runs/pbt
shared:
  dataset: datasets/20250711_ilc_nnqq_sgv_10m_3cat_train8m_parquet
  train_suffix: train8m
  validation_dataset: datasets/20250711_ilc_nnqq_sgv_10m_3cat_parquet
  validation_suffix: val50k_tail
  generations: 50
pbt:
  # fixed_lr_grid never copies; keep the exploit gate outside the whole horizon.
  exploit_interval_generations: 51
