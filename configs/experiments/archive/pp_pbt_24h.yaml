schema_version: 1

experiment:
  name: pp_pbt_24h
  output_root: runs/pbt

shared:
  dataset: datasets/20250218_ilc_nnqq_sgvnew
  checkpoint: checkpoints/pretrained/ilc_nnqq_sgvnew_3cat_cut/net_best_epoch_state.pt
  data_config: /data/suehara/part/data/ilc_nnqq_sgvnew_3cat_cut.217feb3dc9ed1ee6978db1c04604f81b.auto.yaml
  network_config: networks/pretrained_sgv_particle_transformer.py
  training_controller: configs/controllers/linucb_lr_pp_observe.yaml
  seed: 12345
  generations: 64
  weaver_epochs_per_generation: 2
  samples_per_epoch: 2400000
  samples_per_epoch_val: 150000
  batch_size: 1024
  optimizer: ranger
  lr_scheduler: none
  num_workers: 1
  fetch_step: 0.01
  use_amp: true
  amp_dtype: fp16
  no_remake_weights: true

resources:
  gpus: [0, 1, 2, 3]

population:
  - name: member_00
    start_lr: 7.5e-5
  - name: member_01
    start_lr: 9.0e-5
  - name: member_02
    start_lr: 1.05e-4
  - name: member_03
    start_lr: 1.2e-4

pbt:
  metric: validation_bkg_rejection_score
  mode: max
  exploit_fraction: 0.25
  mutation_factors: [0.9, 1.1]
  min_lr: 6.0e-5
  max_lr: 1.4e-4
  degradation_tolerance: 0.02
  degradation_window: 3
  rollback_fraction: 0.25
  controller_state_on_exploit: reset
  seed: 2026
