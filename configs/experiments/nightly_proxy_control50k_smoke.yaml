schema_version: 1
presets:
  - ../presets/shared/pretrained_epoch17_ranger_10m_parquet_proxy_control.yaml
  - ../presets/shared/proxy_control_50k_override.yaml
  - ../presets/resources/local_4gpu.yaml
  - ../presets/pbt/exploit_mutate_significance_tiered.yaml

experiment:
  output_root: runs/dev
  name: nightly_proxy_control50k_smoke

# Config-validation smoke, not a scientific run: confirms the switched
# control tier (control_proxy_50k = val50k_tail, 150,000 events) launches
# cleanly through the real per-generation eval path, produces a finite
# `control` metric, and that `monitor`/legacy `full` are not scheduled
# (monitor_interval_generations nulled below; full_dataset/full_suffix
# already nulled by proxy_control_50k_override.yaml) while `full_holdout`
# (full_validation) still is. full_interval_generations is set high enough
# that it never fires in this short run -- full_validation's real cost is
# measured separately via a direct evaluate_checkpoint_fixed_wp.py call
# (see docs/nightly_plan.md), not duplicated here.
shared:
  generations: 2
  samples_per_epoch: 20000
  samples_per_epoch_val: 4500
  batch_size: 512

population:
  - name: smoke_lr_6e-6
    start_lr: 6.0e-6
  - name: smoke_lr_9e-6
    start_lr: 9.0e-6

pbt:
  burn_in_generations: 1
  exploit_interval_generations: 2
  tiered_validation:
    monitor_interval_generations: null
    full_interval_generations: 100
    evaluate_initial_checkpoint_all_tiers: false
