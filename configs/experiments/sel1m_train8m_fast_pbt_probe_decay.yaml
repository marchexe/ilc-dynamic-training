# sel1m_train8m_fast_pbt_probe with the final LR decay of standard ParT and the LR range of the 3e-3 run.
# Development run on train8m (seed 12345); written 2026-11-20, before the holdout of any probe run.
#
# In sel1m_train8m_fast_pbt_probe the probes kept the LRs high (best 0.1762 at epoch 45 against 0.1916 for
# sel1m_train8m_fast_pbt), but the PBT has no final decay: standard ParT gains about 0.02 on sel1m_tail in its
# decay (epochs 53-67) and selects its last epoch. Two changes:
#   1. final_decay as in sel1m_fast_pbt_decay: the last 15 of 50 generations make no decisions (and run no
#      probes) and every member's LR decays from its generation-35 value by 0.01**(1/15) per epoch, the
#      schedule of sel1m_train8m_standard_part. At 800k this changed nothing; on 8M the decay is where standard
#      ParT gains most.
#   2. The LR range of standard ParT on train8m, which now includes sel1m_train8m_standard_part_3e-3 (ahead of
#      1e-3 from about epoch 60): max_lr 3e-3 and the five highest standard start LRs, 3e-5 to 3e-3. This is
#      the rule of the 2026-11-14 change in sel1m_train8m_fast_pbt (PBT gets the LR range of standard ParT).
# Probes, seed, data and all other rules are sel1m_train8m_fast_pbt_probe. Results of this seed on train8m are
# development; a claim needs new seeds with this configuration frozen beforehand.
presets:
  - sel1m_train8m_fast_pbt_probe.yaml
experiment:
  name: sel1m_train8m_fast_pbt_probe_decay
pbt:
  max_lr: 3.0e-3
  windowed_pbt_v2:
    final_decay: {decay_fraction: 0.3, final_factor: 0.01}
population:
  - name: lr_30e-6
    start_lr: 3.0e-5
  - name: lr_100e-6
    start_lr: 1.0e-4
  - name: lr_300e-6
    start_lr: 3.0e-4
  - name: lr_1000e-6
    start_lr: 1.0e-3
  - name: lr_3000e-6
    start_lr: 3.0e-3
