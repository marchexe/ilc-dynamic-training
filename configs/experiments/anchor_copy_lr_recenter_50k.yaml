schema_version: 1
presets:
  - ../presets/shared/pretrained_epoch17_ranger_10m_parquet_proxy_control.yaml
  - ../presets/shared/proxy_control_50k_override.yaml
  - ../presets/resources/local_4gpu.yaml
  - ../presets/pbt/anchor_copy_lr_recenter.yaml

experiment:
  output_root: runs/pbt
  name: anchor_copy_lr_recenter_50k

# Full-scale anchor_copy_lr_recenter run: real generation count, real
# samples_per_epoch, the full fixed 150,000-event control_proxy_50k
# (val50k_tail via proxy_control_50k_override.yaml, including
# samples_per_epoch_val: 150000 so every generation evaluates the whole
# fixed proxy, not a subsample of it) every generation. For a fast smoke
# run instead, see anchor_copy_lr_recenter_smoke.yaml.
shared:
  generations: 96

population:
  - name: lr_3e-6
    start_lr: 3.0e-6
  - name: lr_6e-6
    start_lr: 6.0e-6
  - name: lr_9e-6
    start_lr: 9.0e-6
  - name: lr_14e-6
    start_lr: 1.4e-5
