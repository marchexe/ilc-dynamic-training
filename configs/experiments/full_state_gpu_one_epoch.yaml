# GPU equivalence test, reference side: one uninterrupted train800k epoch of the 50-epoch control's
# lr_14e-6 member under the full Lookahead contract. Compared with full_state_gpu_fifths.yaml.
presets:
  - foundation_fixed_lr_50epochs.yaml
experiment:
  name: full_state_gpu_one_epoch
shared:
  generations: 1
  optimizer_state_contract: full_lookahead_v1
pbt:
  exploit_interval_generations: 51
  evaluate_initial_checkpoint: false
  evaluate_final_checkpoints: false
population:
  - name: lr_14e-6
    start_lr: 1.4e-5
