schema_version: 1

experiment:
  name: pp_matched
  output_root: runs/parallel

shared:
  dataset: datasets/20250218_ilc_nnqq_sgvnew
  checkpoint: checkpoints/pretrained/ilc_nnqq_sgvnew_3cat_cut/net_best_epoch_state.pt
  data_config: configs/data/ilc_nnqq_sgvnew_3cat.yaml
  network_config: networks/particle_transformer_pp_pretrained.py
  seed: 12345
  epochs: 2
  samples_per_epoch: 2400000
  samples_per_epoch_val: 150000
  batch_size: 256
  start_lr: 1.0e-4
  optimizer: ranger
  lr_scheduler: none
  num_workers: 1
  fetch_step: 0.01
  use_amp: true
  amp_dtype: fp16
  no_remake_weights: true

workers:
  - name: baseline
    gpu: 0
    controller: null
  - name: linucb
    gpu: 2
    controller: configs/controllers/linucb_lr_pp_active.yaml
