schema_version: 1

experiment:
  name: pbt_anchored_lr_sweep
  output_root: runs/pbt

shared:
  dataset: datasets/20250218_ilc_nnqq_sgvnew_parquet
  data_extension: parquet
  checkpoint: checkpoints/pretrained/ilc_nnqq_sgvnew_3cat_cut/net_best_epoch_state.pt
  data_config: /data/suehara/part/data/ilc_nnqq_sgvnew_3cat_cut.217feb3dc9ed1ee6978db1c04604f81b.auto.yaml
  network_config: networks/pretrained_sgv_particle_transformer.py
  training_controller: null
  seed: 12345
  generations: 32
  epochs_per_generation: 2
  samples_per_epoch: 2400000
  samples_per_epoch_val: 150000
  batch_size: 1024
  optimizer: adamw
  lr_scheduler: none
  num_workers: 1
  fetch_step: 0.01
  use_amp: true
  amp_dtype: fp16
  no_remake_weights: true

resources:
  gpus: [0, 1, 2, 3]

population:
  - name: member_00
  - name: member_01
  - name: member_02
  - name: member_03

pbt:
  backend: local_weaver
  strategy: anchored_lr_sweep
  metric: validation_bkg_rejection_score
  mode: max
  base_start_lr: 1.05e-4
  lr_factors: [1.05, 1.025, 0.975, 0.95]
  exploit_fraction: 0.25
  mutation_factors: [0.9, 1.1]
  min_lr: 6.0e-5
  max_lr: 1.4e-4
  degradation_tolerance: 0.02
  degradation_window: 3
  rollback_fraction: 0.0
  controller_state_on_exploit: reset
  seed: 2026
