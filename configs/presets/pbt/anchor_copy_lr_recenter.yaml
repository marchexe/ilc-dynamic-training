schema_version: 1

# Isolated strategy: anchor_copy_lr_recenter. Every generation (no
# burn-in, no significance gate, no exploit-interval throttling -- see
# burn_in_generations/exploit_interval_generations below): select the
# best-finite-metric stream on the per-generation control-tier metric,
# classify it against the single persisted population anchor within
# accept_tolerance, move (or restore) a single shared LR center, copy the
# resulting anchor state to every stream including the winner, and assign a
# deterministic LR spread around the new center.
#
# Explicitly NOT population_lr_policy's algorithm (median-LR-half split,
# per-member own-LR*factor scaling, periodic-tier-gated decisions,
# per-recipient snapshot rollback) -- see
# scripts/training/pbt/planning/anchor_copy_lr_recenter.py's module
# docstring. dynamic_controller is fully disabled (this strategy owns all
# population LR movement); population rollback injection
# (add_global_best_rollbacks) is excluded for this strategy at the code
# level (planning/rollbacks.py::strategy_uses_population_rollbacks), with
# rollback_fraction: 0.0 below as a second, config-level guarantee.
pbt:
  backend: local_weaver
  strategy: anchor_copy_lr_recenter

  # Required by the config schema regardless of strategy; unused by this
  # strategy's planner (exploit_mutate only).
  exploit_fraction: 0.25
  mutation_factors: [1.0]

  # Canonical combined ranking score: total_mistag_score =
  # sqrt(ctag_score * btag_score), each a 4-case geometric mean (see
  # CTAG_REFERENCE_WORKING_POINTS / BTAG_REFERENCE_WORKING_POINTS in
  # scripts/training/runtime.py). Not the older 8-point arithmetic-mean
  # validation_working_point_mistag_percent.
  metric: validation_total_reference_mistag_geomean_percent
  mode: min
  min_lr: 3.0e-6
  max_lr: 1.4e-5

  # Copy execution enabled every generation, from generation 0: no
  # observe-only warmup period, no every-Nth-generation throttling.
  burn_in_generations: 0
  exploit_interval_generations: 1

  # Defense in depth alongside the code-level exclusion in rollbacks.py --
  # even if that exclusion were ever removed, a 0.0 fraction makes
  # add_global_best_rollbacks a mathematical no-op (floor(N * 0.0) == 0).
  rollback_fraction: 0.0
  # Anything other than "rollback_to_initial" makes add_baseline_guard_rollbacks
  # a no-op too (rollbacks.py checks for that exact value) -- stated
  # explicitly rather than left to the None default for the same reason.
  baseline_guard_action: observe

  seed: 2026

  # Completely disabled: this strategy owns all population LR movement.
  # (Omitting the block entirely would have the same effect --
  # dynamic_controller_config() returns None either way -- explicit here
  # so the intent is visible in the config itself, not just implied by
  # absence.)
  dynamic_controller:
    mode: disabled

  # Widened from the original [0.80, 0.90, 1.00, 1.20] (a narrow ~+-20%
  # window, and asymmetric even within that) after the LR-vs-mistag-score
  # investigation (runs/showcase/lr_mistag_correlation_matrix/) found no
  # detectable correlation across 7 independent checks -- a real
  # possibility that ruled out is that the search itself never let LR vary
  # enough to see an effect, not that no effect exists. 5 members,
  # symmetric +-50% around the center, exactly one at 1.0:
  # [0.5, 0.75, 1.0, 1.25, 1.5]. Composing experiment configs must declare
  # a matching 5-entry `population` list -- the historical 4-member configs
  # under configs/experiments/anchor_copy_lr_recenter_*.yaml are frozen
  # records of already-completed runs (each has its own resolved_config.yaml
  # with the exact values that actually ran) and are not meant to be
  # re-launched against this preset unchanged.
  anchor_copy_lr_recenter:
    mode: active
    accept_tolerance: 0.0
    spread_multipliers: [0.5, 0.75, 1.0, 1.25, 1.5]
    # Push new_lr_center a further 7.5% past winner_lr, in the direction
    # winner_lr already indicates, on a genuine accepted_new_anchor -- lets
    # the center reach LR values beyond what's already been sampled instead
    # of only ever snapping back onto the existing multiplier grid.
    recenter_momentum_fraction: 0.075
    # Force-accept the winner (plateau_escape_accepted) after 8 consecutive
    # generations with no genuine accept, instead of rewinding forever --
    # measured cost of not having this: run
    # anchor_copy_lr_recenter_100gen_20260816_105629 spent 30 of its 100
    # generations rewinding after its generation-69 peak (17 of them
    # consecutive at the very end) with no way out.
    plateau_escape_after_generations: 8
    # Widen the spread 1.5x (deviation from 1.0) for that one escape
    # generation only, so the forced accept also gets a wider look at LR
    # space right when the run is otherwise stuck.
    plateau_escape_widen_factor: 1.5

  # Rare full_holdout verification only -- no monitor tier at all (this
  # strategy's control-tier metric already comes from val50k_tail via the
  # experiment-scoped 50k override, so a separate "monitor" round on the
  # same data would just be duplicate compute for no new information).
  tiered_validation:
    full_interval_generations: 16
    evaluate_initial_checkpoint_all_tiers: true
