schema_version: 1

pbt:
  backend: local_weaver
  strategy: anchored_lr_sweep
  confidence_aware_selection: true
  selection_uncertainty_sigma: 1.0
  anchored_weight_source: self
  metric: validation_working_point_mistag_percent
  mode: min
  baseline_metric_value: 1.0426476744821431
  baseline_guard_tolerance: 0.0
  baseline_guard_action: observe
  baseline_guard_reject_global_best: true
  baseline_guard_seed_initial_best: true
  exploit_fraction: 0.25
  mutation_factors: [0.95, 1.05]
  min_lr: 1.2e-5
  max_lr: 3.0e-5
  degradation_tolerance: 0.01
  degradation_window: 2
  rollback_fraction: 0.25
  early_stop_degraded_generations: 6
  controller_state_on_exploit: reset
  seed: 2026
  base_start_lr: 2.15e-5
  lr_radius:
    initial: 0.25
    minimum: 0.05
    shrink_factor: 0.75
    shrink_after_inner_wins: 2
    keep_if_edge_wins: true
  lr_controller:
    mode: smooth
    smoothing: 0.20
    max_center_increase: 1.10
    max_center_decrease: 0.90
    max_member_increase: 1.15
    max_member_decrease: 0.87
    decay_bias: 0.995

  dynamic_controller:
    mode: active
    allowed_actions: [keep, lr_mul_0_95, lr_mul_0_9, lr_mul_1_05, lr_mul_1_1, flag_review]
    metric_delta_tolerance: 0.0
    ema_beta: 0.70
    trend_window: 3
    noisy_metric_threshold: 0.02
    min_delta_sigma_for_action: 1.0
    eval_interval_fraction: 0.20
    action_interval_fraction: 0.20
    generation_epoch_fraction: 0.20
    max_cumulative_lr_factor_per_epoch: 2.0
