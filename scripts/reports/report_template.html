<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PBT Study Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<script defer src="pub/anchors.js"></script>
<style>
/* Research report, layout approved 2026-11-28 ("P4"): a wide grid; figures and tables in a 780 px column with their
   explanation beside them; prose in a 720 px column. Generated by scripts/reports/build_report.py. */
:root { --ink: #1d1d1f; --body: #2b2b2e; --muted: #6e6e73; --rule: #e3e3e6; --link: #2b5797;
  --sans: "Source Sans 3", "Helvetica Neue", Arial, sans-serif; --serif: "Source Serif 4", Georgia, serif; }
body { margin: 0; background: #fff; color: var(--body); font: 17px/1.6 var(--sans); }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 40px; }
.site { font: 600 14px/1 var(--sans); letter-spacing: .02em; color: var(--muted); padding-top: 24px; }
.site a { color: var(--muted); }
.site a:hover { color: var(--ink); text-decoration: none; }
/* header and summary */
header { padding: 44px 0 0; }
h1 { font: 700 42px/1.12 var(--sans); color: var(--ink); margin: 0 0 12px; max-width: 820px; letter-spacing: -.005em; }
.dek { font: 400 21px/1.45 var(--serif); color: var(--muted); max-width: 780px; margin: 0; }
.byline { display: flex; flex-wrap: wrap; gap: 10px 40px; margin: 28px 0 0; padding: 12px 0; border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule); font-size: 14px; line-height: 1.4; }
.byline b { display: block; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.top { display: grid; grid-template-columns: 720px 1fr; column-gap: 72px; margin-top: 40px; }
.top .lead { font: 19px/1.6 var(--serif); color: var(--ink); margin: 0 0 18px; }
ol.findings { list-style: none; padding: 0; margin: 0; counter-reset: f; }
ol.findings li { counter-increment: f; position: relative; padding-left: 30px; margin: 0 0 14px; }
ol.findings li::before { content: counter(f); position: absolute; left: 0; top: 1px; font-weight: 700; color: var(--muted); }
ol.findings b { color: var(--ink); }
.ev { color: var(--muted); white-space: nowrap; }
.fnote { font-size: 14px; color: var(--muted); margin: 4px 0 0; }
.toc { font-size: 15px; line-height: 1.45; border-left: 1px solid var(--rule); padding-left: 24px; align-self: start; }
.toc .h { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
.toc a { display: block; color: var(--ink); margin: 0 0 12px; }
.toc a:hover { color: var(--link); text-decoration: none; }
.toc a span { display: block; font-size: 13px; color: var(--muted); }
/* figures: figure | explanation beside it */
figure { margin: 0; }
figure img { display: block; width: 100%; height: auto; }
figcaption, .fr .cap { font-size: 15px; line-height: 1.55; color: var(--muted); }
figcaption b, .fr .cap > b { display: block; color: var(--ink); font-size: 16px; line-height: 1.35; margin-bottom: 6px; }
.fr { display: grid; grid-template-columns: 780px 1fr; column-gap: 44px; margin: 36px 0 34px; align-items: start; }
.fr figcaption { padding-top: 4px; }
figure.wide img { max-width: 1120px; }
figure.wide figcaption { max-width: 760px; margin-top: 12px; }
.timeline { margin-top: 52px; padding-top: 28px; border-top: 1px solid var(--rule); }
table.par { border-collapse: collapse; font-size: 14px; line-height: 1.4; margin: 22px 0 6px; width: 100%; color: var(--body); }
table.par th { font-weight: 600; color: var(--muted); text-align: left; padding: 0 12px 5px 0; border-bottom: 1px solid var(--rule); vertical-align: bottom; }
table.par td { padding: 5px 12px 5px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
p.src { font-size: 13.5px; line-height: 1.5; margin: 6px 0 0; color: var(--muted); }
/* chapters */
section.ch { margin-top: 104px; }
.kick { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
.kick .no { display: inline-block; min-width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%;
  background: var(--ink); color: #fff; font-weight: 700; font-size: 12.5px; margin-right: 10px; vertical-align: 1px; }
.kick .dot { margin: 0 4px; color: #c4c4c8; }
h2 { font: 700 30px/1.22 var(--sans); color: var(--ink); margin: 0 0 14px; max-width: 820px; letter-spacing: -.005em; }
.ans { font: 400 21px/1.5 var(--serif); color: var(--ink); margin: 0; max-width: 720px; padding-left: 16px; border-left: 3px solid var(--ink); }
.prose { max-width: 720px; font: 18px/1.62 var(--serif); margin-top: 24px; }
.prose p { margin: 0 0 14px; }
.prose b { font-family: var(--sans); font-size: 17px; color: var(--ink); }
.fr + .prose { margin-top: 0; }
p.note { max-width: 720px; font-size: 14.5px; line-height: 1.55; color: var(--muted); margin: 10px 0 0; }
p.note b { color: var(--ink); font-weight: 600; }
.fr.tr { margin: 28px 0 0; }
.fr.tr .cap { padding-top: 0; }
.fr.tr.seed .cap { padding-top: 30px; }
.fr.tr .cap > b { font-size: 15px; }
.scroll { overflow-x: auto; }
table.trials { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.45; }
table.trials th { font-weight: 600; color: var(--muted); text-align: left; padding: 0 14px 6px 0; border-bottom: 1px solid var(--ink); }
table.trials td { padding: 7px 14px 7px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.trials .n { width: 2.6em; color: var(--muted); white-space: nowrap; }
table.trials .d { width: 6.4em; white-space: nowrap; }
table.trials td.v { text-align: right; width: 4.8em; font-variant-numeric: tabular-nums; color: var(--ink); }
table.trials th.v { text-align: right; }
table.cmp { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 1.45; }
table.cmp caption { text-align: left; font-weight: 600; color: var(--ink); padding: 0 0 8px; font-size: 14.5px; }
table.cmp th { font-weight: 600; color: var(--muted); text-align: left; padding: 4px 12px 4px 0; border-bottom: 1px solid var(--ink); vertical-align: bottom; }
table.cmp td { padding: 6px 12px 6px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.cmp .num { text-align: right; font-variant-numeric: tabular-nums; }
table.cmp .iv { display: block; font-size: 12.5px; color: var(--muted); }
table.cmp tr.mean td { border-bottom: 0; }
details.more, details.analysis { max-width: 780px; font-size: 15px; line-height: 1.5; margin: 18px 0 0; }
details.analysis { max-width: none; }
details > summary { cursor: pointer; color: var(--muted); }
details > summary:hover { color: var(--ink); }
details.more ul { padding-left: 1.1em; margin: 8px 0; color: var(--body); }
details.more li { margin: 5px 0; }
details.analysis[open] { padding-bottom: 8px; }
details.analysis figure { margin: 18px 0 0; }
.next { max-width: 780px; margin: 30px 0 0; padding: 12px 0 0; border-top: 1px solid var(--rule); font-size: 15.5px; color: var(--body); }
.next b { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-right: 10px; }
.next a { display: block; margin: 3px 0 0; }
/* conclusions and definitions */
section.end { margin-top: 112px; }
section.end h2 { margin-bottom: 18px; }
section.end .prose { margin-top: 0; }
h3.lim { font: 600 15px/1.3 var(--sans); color: var(--ink); margin: 22px 0 8px; }
ul.limits { max-width: 720px; padding-left: 1.1em; margin: 0; font-size: 16px; line-height: 1.55; }
ul.limits li { margin: 0 0 8px; }
ul.limits b { color: var(--ink); font-weight: 600; }
section.end#setup-definitions { margin-top: 72px; }
.defs { display: grid; grid-template-columns: 1fr 1fr; column-gap: 56px; row-gap: 4px; font-size: 15px; line-height: 1.55; }
.defs h3 { font: 600 15px/1.3 var(--sans); color: var(--ink); margin: 14px 0 4px; }
.defs p { margin: 0; }
footer { margin: 80px 0 64px; font-size: 14px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 14px; }
/* anchor links (pub/anchors.js) and the highlight of a linked target */
a.anchor { font: 400 13px/1 var(--sans); color: var(--muted); margin-left: 6px; opacity: .35; }
a.anchor:hover, a.anchor:focus-visible, [data-anchor]:hover > a.anchor { opacity: 1; text-decoration: none; }
a.tref { color: var(--link); }
[id] { scroll-margin-top: 16px; }
@keyframes target-flash { from { background: #fdf0c8; } to { background: transparent; } }
tr:target > td, li:target, figure:target, section:target > h2, .fr:target, p.note:target { animation: target-flash 2.4s ease-out; }
@media (prefers-reduced-motion: reduce) { tr:target > td, li:target, figure:target { animation: none; background: #fdf6e0; } }
@media (hover: none) { a.anchor { opacity: .6; } }
/* narrower screens: one column */
@media (max-width: 1100px) {
  .top, .fr, .defs { grid-template-columns: minmax(0, 1fr); row-gap: 14px; }
  .toc { border-left: 0; padding-left: 0; }
  .fr.tr.seed .cap { padding-top: 0; }
}
@media (max-width: 760px) {
  .wrap { padding: 0 16px; }
  h1 { font-size: 30px; }
  h2 { font-size: 24px; }
  .dek, .ans { font-size: 18px; }
  .prose { font-size: 17px; }
  section.ch { margin-top: 72px; }
  .scroll table, details.analysis figure img, .timeline img { min-width: 640px; }
  details.analysis figure, .timeline figure { overflow-x: auto; }
}
@media print { a.anchor, .site { display: none !important; } details { display: block; } }
</style>
</head>
<body>
<div class="wrap">
<div class="site"><a href="index.html">ILC dynamic training</a> &nbsp;/&nbsp; Research report &nbsp;·&nbsp; <a href="log.html">Experiment log</a></div>

<footer>Figures: <a href="https://github.com/marchexe/ilc-dynamic-training/blob/main/scripts/reports/publication_figures.py">publication_figures.py</a>

numbers as in <a href="results.html">results</a> and the run records.</footer>
</div>
</body>
</html>
