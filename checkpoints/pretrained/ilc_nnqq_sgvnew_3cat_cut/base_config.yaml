   use_precomputed_weights: false
   reweight_method: flat
   reweight_vars:
      jet_phi: [-10., 10.]
      jet_theta: [-10., 10.]
   reweight_classes: [
      mc_b,
      mc_c,
      mc_d
      ]
   class_weights: [
