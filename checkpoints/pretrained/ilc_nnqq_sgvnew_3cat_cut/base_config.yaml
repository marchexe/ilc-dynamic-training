selection:
   ### use `&`, `|`, `~` for logical operations on numpy arrays
   ### can use functions from `math`, `np` (numpy), and `awkward` in the expression
   #(jet_tightId==1) & (jet_no<2) & (fj_pt>200) & (fj_pt<2500) & (((sample_isQCD==0) & (fj_isQCD==0)) | ((sample_isQCD==1) & (fj_isQCD==1))) & (event_no%7!=0)
   #(recojet_e>=5)

test_time_selection:
   ### selection to apply at test time (i.e., when running w/ --predict)
   #(jet_tightId==1) & (jet_no<2) & (fj_pt>200) & (fj_pt<2500) & (((sample_isQCD==0) & (fj_isQCD==0)) | ((sample_isQCD==1) & (fj_isQCD==1))) & (event_no%7==0)
   #(recojet_e<5)

new_variables:
   ### [format] name: formula
   ### can use functions from `math`, `np` (numpy), and `awkward` in the expression
   #pfcand_mask: awkward.JaggedArray.ones_like(pfcand_etarel)
   #sv_mask: awkward.JaggedArray.ones_like(sv_etarel)
   #pfcand_mask: awkward.JaggedArray.ones_like(pfcand_e)
   pfcand_mask: ak.ones_like(pfcand_e)
   pfcand_p: np.sqrt(pfcand_px*pfcand_px + pfcand_py*pfcand_py + pfcand_pz*pfcand_pz)
   neu_pfcand_mask: ak.ones_like(neu_pfcand_e)
   neu_pfcand_p: np.sqrt(neu_pfcand_px*neu_pfcand_px + neu_pfcand_py*neu_pfcand_py + neu_pfcand_pz*neu_pfcand_pz)

   mc_b: 1*(label==5)
   mc_bbar: 1*(label==-5)
   mc_c: 1*(label==4)
   mc_cbar: 1*(label==-4)
   mc_s: 1*(label==3)
   mc_sbar: 1*(label==-3)
   mc_d: 1*(label==2)
   mc_dbar: 1*(label==-2)
   mc_u: 1*(label==1)
   mc_ubar: 1*(label==-1)
   mc_g: 1*(label==21)

